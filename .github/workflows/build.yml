name: Build Nexus 7 Kernel (3.8V Limit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bison flex libssl-dev bc zip python2 git
        
        # Link python2 per gcc-wrapper.py
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Download Toolchain ARM GCC 4.9
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain

    - name: Build Kernel Image
      run: |
        export ARCH=arm
        export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-linux-androideabi-
        
        if [ -f arch/arm/configs/lineageos_flo_defconfig ]; then
          make lineageos_flo_defconfig
        elif [ -f arch/arm/configs/lineage_flo_defconfig ]; then
          make lineage_flo_defconfig
        elif [ -f arch/arm/configs/flo_defconfig ]; then
          make flo_defconfig
        else
          make lineagew_flo_defconfig
        fi
        
        make -j$(nproc)

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp arch/arm/boot/zImage AnyKernel3/
        cd AnyKernel3
        sed -i 's/device.name1=/device.name1=flo/g' anykernel.sh
        sed -i 's/device.name2=/device.name2=deb/g' anykernel.sh
        zip -r9 ../Nexus7_Kernel_3.8V_Limit.zip * -x .git\* README.md

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexus7_Kernel_3.8V_Limit
        path: Nexus7_Kernel_3.8V_Limit.zip
