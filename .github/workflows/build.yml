name: Build Nexus 7 Kernel (3.8V Limit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Install Toolchain & Fix GCC Header
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-linux-gnueabi libncurses5-dev bison flex libssl-dev bc zip python2
        
        # Link python2 per gcc-wrapper.py
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
        # Crea gli header di supporto per GCC 10, 11 e 12
        cd include/linux
        sudo cp compiler-gcc4.h compiler-gcc7.h 2>/dev/null || true
        sudo cp compiler-gcc4.h compiler-gcc8.h 2>/dev/null || true
        sudo cp compiler-gcc4.h compiler-gcc9.h 2>/dev/null || true
        sudo cp compiler-gcc4.h compiler-gcc10.h 2>/dev/null || true
        sudo cp compiler-gcc4.h compiler-gcc11.h 2>/dev/null || true
        sudo cp compiler-gcc4.h compiler-gcc12.h 2>/dev/null || true

    - name: Build Kernel Image
      run: |
        export ARCH=arm
        export CROSS_COMPILE=arm-linux-gnueabi-
        export KCFLAGS="-w -fgnu89-inline -Wa,-mimplicit-it=thumb -fno-store-merging"
        
        if [ -f arch/arm/configs/lineageos_flo_defconfig ]; then
          make lineageos_flo_defconfig
        elif [ -f arch/arm/configs/lineage_flo_defconfig ]; then
          make lineage_flo_defconfig
        elif [ -f arch/arm/configs/flo_defconfig ]; then
          make flo_defconfig
        else
          make lineagew_flo_defconfig
        fi
        
        make -j$(nproc) KCFLAGS="-w -fgnu89-inline -Wa,-mimplicit-it=thumb -fno-store-merging"

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp arch/arm/boot/zImage AnyKernel3/
        cd AnyKernel3
        sed -i 's/device.name1=/device.name1=flo/g' anykernel.sh
        sed -i 's/device.name2=/device.name2=deb/g' anykernel.sh
        zip -r9 ../Nexus7_Kernel_3.8V_Limit.zip * -x .git\* README.md

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexus7_Kernel_3.8V_Limit
        path: Nexus7_Kernel_3.8V_Limit.zip
