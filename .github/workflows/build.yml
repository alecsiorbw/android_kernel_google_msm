name: Build Nexus 7 Kernel (3.8V Limit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-linux-gnueabi libncurses5-dev bison flex libssl-dev bc zip

    - name: Build Kernel Image
      run: |
        export ARCH=arm
        export CROSS_COMPILE=arm-linux-gnueabi-
        make lineagew_flo_defconfig || make flo_defconfig || make lineageos_flo_defconfig
        make -j$(nproc)

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp arch/arm/boot/zImage AnyKernel3/
        cd AnyKernel3
        sed -i 's/device.name1=/device.name1=flo/g' anykernel.sh
        sed -i 's/device.name2=/device.name2=deb/g' anykernel.sh
        zip -r9 ../Nexus7_Kernel_3.8V_Limit.zip * -x .git\* README.md

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexus7_Kernel_3.8V_Limit
        path: Nexus7_Kernel_3.8V_Limit.zip
